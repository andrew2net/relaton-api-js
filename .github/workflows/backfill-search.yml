name: backfill-search

# Rebuilds documents_search (the query-side v2 projection) from the stored
# documents_v2 JSON across all flavors. Runs once after the migration
# lands; resumable by cursor, safe to re-run (the projection upserts by
# document key).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Run the projection backfill
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
        run: tools/build_search.sh
