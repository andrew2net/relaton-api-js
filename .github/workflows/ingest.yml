name: ingest

# The v2 producer is the one ingestion path: it walks the flavor's Pages
# machine index, posts model-JSON chunks to /admin/ingest-v2, and
# reconciles the flavor (rows the wave never re-stamped are ghosts).
# The weekly schedule sweeps the fleet serially — parallel heavy legs
# saturate D1 (CPU-time-limit resets); dataset push dispatches come per
# flavor from the relaton-data-* repos.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      v2_flavors:
        description: "Space-separated flavors to ingest into storage v2"
        type: string
        required: false
        default: ""
      limit:
        description: "Process at most N documents per flavor (shard size; empty = all)"
        type: string
        required: false
        default: ""
      v2_from_chunk:
        description: "Resume after this many chunks (chunk count to drain before posting)"
        type: string
        required: false
        default: ""
      reconcile_flavor:
        description: "Reconcile this flavor instead of ingesting (requires reconcile_before)"
        type: string
        required: false
        default: ""
      reconcile_before:
        description: "Reconcile cutoff: delete rows not re-stamped since this ISO timestamp"
        type: string
        required: false
        default: ""
  # relaton-data-* repos dispatch this on push (client_payload.flavor), so
  # dataset updates reach the API on their slice immediately instead of
  # waiting for the weekly sweep.
  repository_dispatch:
    types: [relaton-data-update]

jobs:
  reconcile-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.reconcile_flavor != ''
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile flavor
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          FLAVOR: ${{ inputs.reconcile_flavor }}
          BEFORE: ${{ inputs.reconcile_before }}
        run: |
          curl -sf -X POST "https://api.relaton.org/admin/reconcile-v2/$FLAVOR" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"before\": \"$BEFORE\"}" | jq -c .

  matrix:
    # A manual-reconcile dispatch runs reconcile-manual only. The weekly
    # schedule and targeted dispatches drive the flavor matrix.
    if: github.event_name != 'repository_dispatch' && inputs.reconcile_flavor == ''
      && (github.event_name == 'schedule' || inputs.v2_flavors != '')
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.set.outputs.flavors }}
    steps:
      - id: set
        env:
          FLAVORS: ${{ inputs.v2_flavors }}
        run: |
          if [ -n "$FLAVORS" ]; then
            echo "flavors=$(echo "$FLAVORS" | jq -Rc 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          else
            echo 'flavors=["3gpp","adobe","bipm","calconnect","ccsds","cie","easc","ecma","etsi","gost","iala","iana","iec","ieee","ietf","iho","iso","itu-r","itu","jcgm","jis","nist","oasis","ogc","oiml","plateau","rfcs","rfcsubseries","sae","w3c","xsf"]' >> "$GITHUB_OUTPUT"
          fi

  ingest-v2:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # One heavy producer walk at a time: parallel legs saturate D1.
      max-parallel: 1
      matrix:
        flavor: ${{ fromJSON(needs.matrix.outputs.flavors) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest into storage v2
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit }}
          FROM_CHUNK: ${{ inputs.v2_from_chunk }}
        run: |
          args=""
          [ -n "$LIMIT" ] && args="$args --limit $LIMIT"
          [ -n "$FROM_CHUNK" ] && args="$args --from-chunk $FROM_CHUNK"
          node packages/relaton-api/bin/relaton-api.mjs ingest ${{ matrix.flavor }} \
            --v2 --base https://api.relaton.org --token-env ADMIN_TOKEN $args
      # Only a full (unsharded) wave reconciles: a limited shard leaves the
      # rest of the flavor's rows un-stamped, and deleting them would be
      # worse than keeping the ghosts another cycle.
      - name: Reconcile the flavor
        if: inputs.limit == '' && inputs.v2_from_chunk == ''
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
        run: |
          echo "reconciling ${{ matrix.flavor }} (before ${{ github.run_started_at }})"
          curl -sf -X POST "https://api.relaton.org/admin/reconcile-v2/${{ matrix.flavor }}" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"before\": \"${{ github.run_started_at }}\"}" | jq -c .

  # One relaton-data-* slice, dispatched by that dataset's own push workflow.
  ingest-dispatch:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest into storage v2
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: |
          node packages/relaton-api/bin/relaton-api.mjs ingest "$FLAVOR" \
            --v2 --base https://api.relaton.org --token-env ADMIN_TOKEN
      - name: Reconcile the flavor
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: |
          curl -sf -X POST "https://api.relaton.org/admin/reconcile-v2/$FLAVOR" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"before\": \"${{ github.run_started_at }}\"}" | jq -c .
