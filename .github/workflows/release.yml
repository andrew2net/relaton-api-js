name: Release npm (@relaton/api)

# Trusted publishing: keyless OIDC. Copied from parsanol/parsanol-ts
# publish.yml (the proven pattern). Requires the owner-side registration
# on npmjs.com — package @relaton/api → Settings → Trusted Publishing:
#   Repository: relaton/relaton-api-js | Workflow: release.yml (no environment)
#
# Release procedure: bump the package version (npm version X.Y.Z in
# packages/relaton-api), push — the v* tag publishes.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # the OIDC token that replaces the npm token

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publish with provenance
        working-directory: packages/relaton-api
        run: |
          # npm refuses a prerelease under the default latest tag.
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish --access public --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: "" # explicit: trusted publishing only, no token
