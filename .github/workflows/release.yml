name: release

# Publishes a workspace package to npm through Trusted Publishing (OIDC):
# the package's Trusted Publisher on npmjs.com names this workflow, so the
# dispatch itself is the authorization — no npm token lives in the repo.
# The exact version comes from the operator; the workflow never invents one.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace package to release"
        required: true
        type: choice
        options:
          - "@relaton/api"
      next_version:
        description: "Exact version to publish (must not already exist on npm)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp the release version
        run: |
          node --eval '
            const fs = require("node:fs");
            const path = "packages/relaton-api/package.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          ' "${{ inputs.next_version }}"
          npm install --package-lock-only
      - name: Publish (npm trusted publishing, OIDC)
        working-directory: packages/relaton-api
        run: npm publish --provenance --access public
      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/relaton-api/package.json package-lock.json
          git diff --cached --quiet && (echo "nothing to commit"; exit 1)
          git commit -m "Release @relaton/api ${{ inputs.next_version }}"
          git tag "relaton-api-v${{ inputs.next_version }}"
          git push origin HEAD:"main"
          git push origin "relaton-api-v${{ inputs.next_version }}"
